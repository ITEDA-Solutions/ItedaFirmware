name: Build & Deploy OTA (Stable Fixed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Libraries
        run: |
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "PID"

      - name: Clean Build Folder
        run: rm -rf ota_build pages_deploy

      - name: Compile Firmware
        run: |
          mkdir -p ota_build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc,PartitionScheme=app3M_fat9M_16MB \
            --output-dir ./ota_build \
            ItedaFirmware.ino
          echo "Build output:"
          ls -lahR ota_build

      # BUG FIX: arduino-cli emits several .bin files (app, bootloader, partitions).
      # `find … | head -n 1` often picks the ~20KB bootloader. OTA must get *.ino.bin.
      - name: Select Application Binary
        run: |
          set -euo pipefail
          mkdir -p pages_deploy

          echo "All .bin files produced:"
          find ota_build -name "*.bin" -printf "%s\t%p\n" | sort -n

          APP_BIN=$(find ota_build -type f -name "*.ino.bin" \
            ! -name "*bootloader*" \
            ! -name "*partitions*" \
            ! -name "*merged*" \
            | head -n 1)

          if [ -z "${APP_BIN}" ]; then
            echo "ERROR: Application binary (*.ino.bin) not found"
            exit 1
          fi

          SIZE=$(stat -c%s "$APP_BIN")
          echo "Using application binary: $APP_BIN ($SIZE bytes)"

          # Real ESP32 Arduino sketches with WiFi/TLS are hundreds of KB+.
          # Bootloader is typically ~15–25KB — reject that class of mistake.
          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: Binary is only $SIZE bytes — almost certainly not the app image"
            exit 1
          fi

          cp "$APP_BIN" pages_deploy/ItedaFirmware.bin
          ls -lah pages_deploy/ItedaFirmware.bin

      - name: Extract Version
        run: |
          VERSION=$(grep -E '^\s*const char\*\s+VERSION\s*=' ItedaFirmware.ino | head -n1 | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract VERSION from ItedaFirmware.ino"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Extracted VERSION=$VERSION"

      - name: Generate Manifest
        run: |
          REPO_NAME=$(basename "${{ github.repository }}")
          cat > pages_deploy/manifest.json <<EOF
          {
            "version": "${VERSION}",
            "build": "${GITHUB_RUN_NUMBER}",
            "bin_url": "https://${{ github.repository_owner }}.github.io/${REPO_NAME}/ItedaFirmware.bin?v=${GITHUB_RUN_NUMBER}"
          }
          EOF
          echo "Manifest:"
          cat pages_deploy/manifest.json

      - name: Show Deploy Bundle
        run: ls -lah pages_deploy

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages_deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
